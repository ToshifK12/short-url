name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: mvn -B -DskipTests package

      - name: Unit tests
        run: mvn -B test

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: short-url-jar
          path: target/short-url.jar

  load-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install wrk
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wrk

      - name: Bring up the full stack
        run: docker compose up --build -d

      - name: Wait for the stack to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/v1/health; then exit 0; fi
            sleep 2
          done
          echo "Stack did not become healthy in time" >&2
          docker compose logs
          exit 1

      - name: Load test - write path (POST /api/v1/shorten)
        run: wrk -t4 -c200 -d20s -s loadtest/shorten_workload.lua http://localhost:8080 | tee shorten_results.txt

      - name: Seed codes for the read path
        run: ./loadtest/seed.sh http://localhost:8080 3000

      - name: Load test - read path (GET /{code} redirect)
        run: wrk -t4 -c200 -d20s -s loadtest/redirect_workload.lua http://localhost:8080 | tee redirect_results.txt

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Upload load test results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            shorten_results.txt
            redirect_results.txt
