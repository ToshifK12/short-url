events {
    worker_connections 4096;
}

http {
    upstream shorturl_backend {
        least_conn;
        server app-1:8080;
        server app-2:8080;
        keepalive 256;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://shorturl_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
